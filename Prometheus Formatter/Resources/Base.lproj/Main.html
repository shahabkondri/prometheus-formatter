<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'">

	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

	<link rel="stylesheet" href="../Style.css">
	<script src="../Script.js" defer></script>
</head>
<body>
	<img src="../icon.png" width="128" height="128" alt="Prometheus Formatter Icon">
	
	<p class="state-unknown">Enable Prometheus Formatter in Safari Extensions Preferences.</p>
	<p class="state-on">Prometheus Formatter is active.</p>
	<p class="state-off">Prometheus Formatter is inactive. Enable it in Safari Extensions Preferences.</p>
	
	<div class="actions">
		<button class="open-preferences" type="button" title="Open Safari Extensions Preferences">
			<span class="button-label">Open Safari Extensions Preferences</span>
		</button>
		<button class="open-review-page" type="button" title="Rate in App Store">
			<svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
				<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"></polygon>
			</svg>
			<span class="button-label">Rate in App Store</span>
		</button>
	</div>
</body>
</html>
